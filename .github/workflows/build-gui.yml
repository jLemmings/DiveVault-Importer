name: Build Go desktop importer

on:
  # Stable release: "Draft a new release" on GitHub, save the draft, then run
  # this workflow. It tags the draft's target commit, builds everything and
  # attaches the binaries to the draft; then publish the draft on GitHub.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the draft release to build (empty = newest draft)
        required: false
        default: ''
  push:
    branches: [master, 'feature/*']
    # Stable releases: push a tag equal to the VERSION file, e.g. 0.3.0 or v0.3.0.
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what this run is for and which commit and version it builds:
  #   stable - a draft release (manual run) or a pushed version tag
  #   dev    - a push to master, published as <VERSION>-dev.<sha>
  #   none   - feature branches and pull requests: build and test only
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: write # draft releases are only visible with write access
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mode=none sha="$GITHUB_SHA" tag=""
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              tag="$(gh release list --limit 100 --json tagName,isDraft,createdAt \
                -q '[.[] | select(.isDraft)] | sort_by(.createdAt) | last | .tagName // ""')"
            fi
            target="$( [ -n "$tag" ] && gh release view "$tag" --json isDraft,targetCommitish \
              -q 'if .isDraft then .targetCommitish else "" end' 2>/dev/null || true)"
            if [ -z "$target" ]; then
              echo "::error::No draft release found${tag:+ for $tag}. On GitHub, use 'Draft a new release', save it as a draft, then run this workflow again."
              exit 1
            fi
            sha="$(gh api "repos/$GH_REPO/commits/$target" -q .sha)"
            mode=stable
            echo "Building draft release $tag from $target ($sha)"
          elif [ "$REF_TYPE" = tag ]; then
            mode=stable tag="$REF_NAME"
          elif [ "$REF" = refs/heads/master ] && [ "$EVENT" = push ]; then
            mode=dev
          fi
          base="$(gh api "repos/$GH_REPO/contents/VERSION?ref=$sha" -H 'Accept: application/vnd.github.raw' | tr -d '[:space:]')"
          if [ "$mode" = stable ]; then
            if [ "${tag#v}" != "$base" ]; then
              echo "::error::Release tag $tag does not match VERSION ($base) at $sha. Update VERSION on master first, or rename the draft's tag."
              exit 1
            fi
            version="$base"
          else
            version="$base-dev.${sha::7}"
          fi
          echo "mode=$mode sha=$sha tag=$tag version=$version"
          {
            echo "mode=$mode"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  security:
    needs: resolve
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 keeps the Linux glibc requirement low; macos-15-intel
        # covers Intel Macs alongside the Apple Silicon macos-latest runner.
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '1'
      CGO_LDFLAGS_ALLOW: -Wl,-rpath,@executable_path/../Frameworks
      DIVESYNC_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Builds that publish releases never restore a shared cache.
          cache: ${{ needs.resolve.outputs.mode == 'none' }} # zizmor: ignore[cache-poisoning] disabled whenever the build is published
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libusb-1.0-0-dev libhidapi-dev libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config libusb hidapi
      - name: Windows native dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # libusb/hidapi are not installed: build_libdivecomputer.sh configures
          # Windows builds --without-libusb --without-hidapi, and MSYS2 no longer
          # publishes those packages for the MINGW64 environment.
          install: autoconf automake libtool make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Fetch libdivecomputer 0.9.0
        run: go run ./scripts/fetch
      - name: Build libdivecomputer on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build_libdivecomputer.sh
      - name: Configure Windows Go toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\mingw64\bin' >> $env:GITHUB_PATH
          "$pwd\vendor\native\bin" >> $env:GITHUB_PATH
          'CC=gcc' >> $env:GITHUB_ENV
      - name: Build libdivecomputer on Unix
        if: runner.os != 'Windows'
        run: |
          bash scripts/build_libdivecomputer.sh
          echo "LD_LIBRARY_PATH=$PWD/vendor/native/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/vendor/native/lib" >> "$GITHUB_ENV"
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$pwd\vendor\native\bin;$env:PATH"
          go test -count=1 -shuffle=on ./...
      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: go test -count=1 -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      # Signing is optional: without these secrets the build falls back to an
      # ad-hoc macOS signature and an unsigned Windows executable. Secrets are
      # never exposed to pull request builds.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then echo "No macOS signing certificate configured"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
      - name: Prepare Windows code signing
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { 'No Windows signing certificate configured'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          "WINDOWS_SIGN_CERT_FILE=$pfx" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Package desktop application
        env:
          MACOS_SIGN_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_NOTARY_APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
          MACOS_NOTARY_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_TEAM_ID || '' }}
          MACOS_NOTARY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_PASSWORD || '' }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: go run ./scripts/package
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP ('DiveSync standalone ' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          $binary = Get-ChildItem dist/DiveSync-windows-*.exe | Select-Object -First 1
          Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path $smokeDir 'DiveSync.exe')
          $env:LOCALAPPDATA = Join-Path $smokeDir 'cache'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $stdout = Join-Path $smokeDir 'stdout.txt'
          $stderr = Join-Path $smokeDir 'stderr.txt'
          $process = Start-Process -FilePath (Join-Path $smokeDir 'DiveSync.exe') -ArgumentList '-check-runtime' -WorkingDirectory $smokeDir -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout, $stderr
          if ($process.ExitCode -ne 0) { throw "Standalone runtime check failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: DiveSync-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  # Stable: tags the release commit, then attaches binaries to the draft
  # release (creating the draft for a plain tag push). Dev: publishes a
  # uniquely tagged <VERSION>-dev.<sha> pre-release and prunes old ones.
  # Tags are never reused: this repository uses immutable releases, so a
  # published release can't get assets later and its tag can never be
  # recreated, even after the release is deleted.
  publish:
    name: Publish release
    if: needs.resolve.outputs.mode != 'none'
    needs: [resolve, build, security]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOFLAGS: -mod=readonly
      CYCLONEDX_GOMOD_VERSION: v1.9.0
      DIVESYNC_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SBOM and checksums
        run: |
          go run "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}" \
            mod -json -licenses -output "release-assets/DiveSync-${DIVESYNC_VERSION}.sbom.cdx.json"
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - name: Attach binaries to draft stable release
        if: needs.resolve.outputs.mode == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh release view "$RELEASE_TAG" --json isDraft -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)"
          if [ "$state" = published ]; then
            echo "::error::Release $RELEASE_TAG was published before CI attached its binaries, and immutable releases can't receive assets. Delete it, bump VERSION, and release again: Draft a new release, save the draft, run this workflow, then publish."
            exit 1
          fi
          # Tag the built commit so publishing the draft can't point anywhere else.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" -q .sha)"
            if [ "$tagged" != "$RELEASE_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already points at $tagged, not the built commit $RELEASE_SHA"
              exit 1
            fi
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" >/dev/null
            echo "Created tag $RELEASE_TAG at $RELEASE_SHA"
          fi
          if [ "$state" = draft ]; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag \
              --title "DiveVault Importer $RELEASE_TAG" --generate-notes
          fi
          url="$(gh release view "$RELEASE_TAG" --json url -q .url)"
          echo "Binaries attached to draft release [$RELEASE_TAG]($url). Review it and click **Publish release**." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish development pre-release
        if: needs.resolve.outputs.mode == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DEV_RELEASES: '3'
        run: |
          tag="$DIVESYNC_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Pre-release $tag already exists (re-run); nothing to publish."
          else
            notes="Automated development build of commit $RELEASE_SHA. Not a stable release.
          Verify downloads with \`sha256sum -c SHA256SUMS.txt --ignore-missing\` or \`gh attestation verify <file> -R $GH_REPO\`."
            gh release create "$tag" release-assets/* --prerelease --latest=false --target "$RELEASE_SHA" \
              --title "DiveVault Importer $tag" --notes "$notes"
          fi
          # Keep only the newest development builds.
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            -q '[.[] | select(.isPrerelease and (.tagName | test("-dev[.][0-9a-f]{7}$")))] | sort_by(.createdAt) | reverse | .[]?.tagName' |
            tail -n +"$((KEEP_DEV_RELEASES + 1))" |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes && echo "Pruned $old"; done
