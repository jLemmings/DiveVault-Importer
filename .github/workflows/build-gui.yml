name: Build Go desktop importer

on:
  workflow_dispatch:
  push:
    branches: [master, 'feature/*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libusb-1.0-0-dev libhidapi-dev libgl1-mesa-dev xorg-dev
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config libusb hidapi
      - name: Windows native dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: autoconf automake libtool make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libusb mingw-w64-x86_64-hidapi
      - name: Fetch libdivecomputer 0.9.0
        run: go run ./scripts/fetch
      - name: Build libdivecomputer on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build_libdivecomputer.sh
      - name: Configure Windows Go toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\mingw64\bin' >> $env:GITHUB_PATH
          "$pwd\vendor\native\bin" >> $env:GITHUB_PATH
          'CC=gcc' >> $env:GITHUB_ENV
      - name: Build libdivecomputer on Unix
        if: runner.os != 'Windows'
        run: |
          bash scripts/build_libdivecomputer.sh
          echo "LD_LIBRARY_PATH=$PWD/vendor/native/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/vendor/native/lib" >> "$GITHUB_ENV"
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l main.go main_test.go resources.go theme.go internal scripts/fetch scripts/package)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Package desktop application
        run: go run ./scripts/package
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP ('DiveSync standalone ' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          $binary = Get-ChildItem dist/DiveSync-windows-*.exe | Select-Object -First 1
          Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path $smokeDir 'DiveSync.exe')
          $env:LOCALAPPDATA = Join-Path $smokeDir 'cache'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $stdout = Join-Path $smokeDir 'stdout.txt'
          $stderr = Join-Path $smokeDir 'stderr.txt'
          $process = Start-Process -FilePath (Join-Path $smokeDir 'DiveSync.exe') -ArgumentList '-check-runtime' -WorkingDirectory $smokeDir -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout, $stderr
          if ($process.ExitCode -ne 0) { throw "Standalone runtime check failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: DiveSync-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          flags=()
          if gh release view "$version" >/dev/null 2>&1; then
            version="${version}-$(git rev-parse --short=7 HEAD)"
            flags+=(--prerelease)
          fi
          gh release create "$version" release-assets/* --title "DiveVault Importer $version" --notes "Go desktop build for commit $GITHUB_SHA" --latest=false "${flags[@]}"
